<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230052CC'/><rect x='7' y='8' width='5' height='16' rx='1.5' fill='white'/><rect x='14' y='8' width='5' height='11' rx='1.5' fill='white'/><rect x='21' y='8' width='5' height='7' rx='1.5' fill='white'/></svg>" />
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem("flowboard:theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Flowboard — Kanban для команд</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
